<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signalpost Company Profiles</title>
<script>
(function(){var t=null;try{t=localStorage.getItem("sp-theme")}catch(e){}
if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"}
document.documentElement.setAttribute("data-theme",t)})();
</script>
<style>
:root{--bg:#eef2f9;--panel:#fff;--panel2:#f5f7fc;--ink:#101828;--muted:#566176;--line:#e1e7f2;--accent:#2f6bff;--link:#1a4fc4;--accent-soft:#e6eeff;
--ok:#12823b;--warn:#a85d00;--bad:#c62828;--na:#566176;--purple:#6f42c1;--t-blue:#eaf1ff;--t-green:#e8f6ed;--t-amber:#fff2d9;--t-grey:#edf0f6;
--shadow:0 1px 2px rgba(16,24,40,.06),0 6px 18px rgba(16,24,40,.05);--hh:64px}
:root[data-theme=dark]{--bg:#0a1020;--panel:#121b2e;--panel2:#18233a;--ink:#e8eefc;--muted:#9aa8c6;--line:#24324f;--accent:#6b97ff;--link:#9bbaff;--accent-soft:#1c2c55;
--ok:#46dd8a;--warn:#ffb340;--bad:#ff7070;--na:#9aa8c6;--purple:#bb9bf5;--t-blue:#16264a;--t-green:#12301f;--t-amber:#38290e;--t-grey:#18233a;
--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25)}
*{box-sizing:border-box}
html{color-scheme:light dark;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--link)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mut{color:var(--muted)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ---- top bar ---- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:#101828;color:#fff;display:grid;place-items:center;flex:none}
:root[data-theme=dark] .logo{background:#1d2b4a}
.brand b{display:block;font-size:17px;line-height:1.1}.brand span{font-size:17px;font-weight:700;line-height:1.1}
.runinfo{border-left:1px solid var(--line);padding-left:12px;font-size:13px;line-height:1.35}
.search{position:relative;flex:1 1 260px;min-width:180px}
#searchIcon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;display:flex}
.search input{width:100%;min-height:42px;padding:9px 66px 9px 36px;border:1px solid var(--line);border-radius:11px;background:var(--panel2)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--panel);pointer-events:none}
.search .clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:8px;font-size:15px}
.search .clr:hover{background:var(--line)}
.search .clr[hidden]{display:none}
.btn{display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:8px 13px;border:1px solid var(--line);border-radius:11px;background:var(--panel);cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn .lbl{overflow:hidden;text-overflow:ellipsis;max-width:200px}
.btn:hover:not([disabled]){background:var(--panel2)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.primary{background:var(--accent-soft);border-color:var(--accent);color:var(--link)}
.btn.active{border-color:var(--accent);background:var(--accent-soft);color:var(--link)}
.btn.icon{padding:8px 11px;min-width:42px;justify-content:center}
.pop{position:relative}
.popmenu{position:absolute;top:calc(100% + 6px);left:0;z-index:40;min-width:270px;max-width:min(430px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px}
.popmenu.right{left:auto;right:0}
.popmenu[hidden]{display:none}
.popmenu label{display:flex;gap:10px;align-items:center;min-height:40px;padding:6px 8px;border-radius:8px;cursor:pointer}
.popmenu label:hover{background:var(--panel2)}
.popmenu input[type=radio]{width:18px;height:18px;accent-color:var(--accent)}
.popmenu h4{margin:8px 8px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.popmenu p.note{padding:0 8px}
.legend{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;padding:4px 8px;font-size:13px}
/* ---- state badges (text + glyph + border style; never colour alone) ---- */
.st,.dot{--c:var(--na)}
.st-available{--c:var(--ok)}.st-ambiguous{--c:var(--warn)}.st-blocked{--c:var(--purple)}.st-failed{--c:var(--bad)}.st-not_available{--c:var(--na)}.st-not_applicable{--c:var(--na)}
.st{display:inline-flex;align-items:center;gap:5px;padding:2px 10px 2px 8px;border-radius:999px;border:2px solid var(--c);background:var(--panel);color:var(--ink);font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;line-height:1.5}
.st i{font-style:normal;font-weight:900;font-size:13px;color:var(--c)}
.st.st-ambiguous{border-style:dashed}.st.st-not_available{border-style:dotted}.st.st-not_applicable{border-style:dotted}.st.st-blocked{border-style:double;border-width:3px}
.st.sm{font-size:11px;padding:1px 8px 1px 6px}
.dot{width:20px;height:20px;border:1.5px solid var(--c);border-radius:6px;display:inline-grid;place-items:center;font-size:12px;font-weight:900;color:var(--c);background:var(--panel)}
.dot.st-ambiguous{border-style:dashed}.dot.st-not_available,.dot.st-not_applicable{border-style:dotted}.dot.st-blocked{border-style:double;border-width:3px}
/* ---- global strip ---- */
.strip{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;padding:9px 16px;background:var(--panel);border-bottom:1px solid var(--line);font-size:13.5px}
.sg{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lab{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.meter{display:inline-block;width:130px;height:10px;border-radius:99px;background:var(--line);overflow:hidden;vertical-align:middle}
.meter b{display:block;height:100%;background:var(--ok)}
.meter.low b{background:var(--bad)}
.sc{display:inline-flex;align-items:center;gap:5px}.sc b{font-variant-numeric:tabular-nums}
/* ---- layout ---- */
.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px;padding:14px 16px;align-items:start}
.side{position:sticky;top:calc(var(--hh) + 12px);max-height:calc(100vh - var(--hh) - 24px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.sidehead{position:sticky;top:0;background:var(--panel);z-index:2;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.sidehead h2{margin:0 0 8px;font-size:16px}
.srow{display:flex;gap:8px}
.srow select,.srow input{min-height:40px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);min-width:0}
.srow input{flex:1}
.hint{margin:8px 0 0;font-size:13px;color:var(--muted)}
.item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover{background:var(--panel2)}.item.active{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.cbw{display:grid;place-items:center;width:44px;height:44px;margin:-12px 0 -12px -14px;flex:none;cursor:pointer}
.cbw .cb{width:20px;height:20px;accent-color:var(--accent);cursor:pointer}
.im{flex:1;min-width:0}.nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.chev{color:var(--muted);flex:none}
.empty{padding:24px;text-align:center;color:var(--muted)}.empty .btn{margin-top:10px}
.morebtn{display:flex;margin:10px auto 14px}
.morebtn[hidden]{display:none}
/* ---- detail ---- */
.back{display:none}
#detail:focus{outline:none}
.hero{display:flex;gap:14px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
.hero h1{margin:0;font-size:24px;line-height:1.2;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sub2{margin-top:4px;color:var(--muted)}.sub2 b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;gap:5px;align-items:center;padding:3px 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px}
.links{display:flex;gap:8px;flex-wrap:wrap}
.ins{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(250px,.85fr);gap:12px;margin-bottom:12px}
.ins .col{display:flex;flex-direction:column;gap:12px}
.insc{border-radius:16px;padding:16px 18px;border:1px solid var(--line);box-shadow:var(--shadow)}
.insc h2{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.insc p{margin:0 0 8px}
.insc.blue{background:var(--t-blue)}.insc.green{background:var(--t-green)}.insc.amber{background:var(--t-amber)}.insc.grey{background:var(--t-grey)}
.tag{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);margin-left:auto;color:var(--ink)}
.insc ul{margin:0;padding-left:18px}
.insc details{margin:2px 0 8px}.insc summary{cursor:pointer;color:var(--link);font-weight:600;font-size:13.5px;padding:7px 0}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.sec{grid-column:span 3;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 15px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sec.s4{grid-column:span 4}.sec.s12,.sec.open{grid-column:1/-1}
.sh{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.sh h3{margin:0;font-size:15px;flex:1;min-width:110px}
.num{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--link);font-weight:800;display:grid;place-items:center;font-size:13px;flex:none}
.kv{display:grid;grid-template-columns:minmax(78px,auto) minmax(0,1fr);gap:6px 12px;font-size:14px}
.kv .k{color:var(--muted)}.kv .v{overflow-wrap:anywhere}
.kv .v a{display:inline-block;padding:3px 0}
.note{margin:0;color:var(--muted);font-size:14px}
.mini{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.mini th{text-align:left;font-size:12px;color:var(--muted);padding:5px 6px;background:var(--panel2)}
.mini td{padding:5px 6px;border-top:1px solid var(--line)}
.mini td:nth-child(n+3),.mini th:nth-child(n+3){text-align:right}
.sf{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:6px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.more{border:0;background:none;color:var(--link);font-weight:700;cursor:pointer;display:inline-flex;gap:3px;align-items:center;min-height:36px;padding:3px 4px;border-radius:8px;font-size:13px}
.more:hover{background:var(--accent-soft)}
.fresh b{color:var(--ink)}
.facts{width:100%;border-collapse:collapse;font-size:14px;margin-top:2px}
.facts th.l{width:27%;text-align:left;font-weight:400;color:var(--muted);padding:9px 6px;border-top:1px solid var(--line);vertical-align:top}
.facts td{padding:9px 6px;border-top:1px solid var(--line);vertical-align:top}
.facts td.stc{width:1%;white-space:nowrap;text-align:right}
.facts .inl{display:none}
.facts tr.grp th{background:var(--panel2);font-size:12px;font-weight:800;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;padding:7px 6px;text-align:left}
.val{overflow-wrap:anywhere}
.src details{font-size:13px;color:var(--muted);margin-top:2px}.src summary{cursor:pointer;padding:5px 0}
.src a{display:inline-block;padding:3px 0}
.stale{font-size:12px;font-weight:800;color:var(--warn);border:1px dashed var(--warn);border-radius:6px;padding:0 6px;margin-left:6px}
.evc{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:15px 18px}
.evc h2{margin:0 0 8px;font-size:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.evc .kv{grid-template-columns:110px minmax(0,1fr)}
.cmp{overflow:auto}.cmp table{width:100%;border-collapse:collapse}.cmp td,.cmp th{padding:9px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top;min-width:150px}
.cmp td:first-child,.cmp th:first-child{min-width:110px;color:var(--muted);font-weight:400}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px 18px}
.card h2{margin:0 0 10px;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:8px}
/* ---- responsive ---- */
@media (max-width:1180px){.runinfo{display:none}.ins{grid-template-columns:1fr 1fr}.ins .col{grid-column:1/-1;flex-direction:row}.ins .col>*{flex:1}.sec,.sec.s4{grid-column:span 6}}
@media (max-width:900px){.top{position:static}:root{--hh:0px!important}.layout{grid-template-columns:1fr}.side{position:static;max-height:none}
 #detail{display:none}body.show-detail #detail{display:block}body.show-detail .side{display:none}.back{display:inline-flex;margin-bottom:10px}
 .ins{grid-template-columns:1fr}.ins .col{flex-direction:column}.sec,.sec.s4{grid-column:1/-1}.hero h1{font-size:22px}}
@media (max-width:600px){
 .dsk{display:none}
 .top{padding:8px 12px;gap:8px}.layout{padding:10px}.strip{padding:8px 12px;gap:6px 14px}
 .brand{order:1;flex:1}.brand span,.brand b{font-size:15px}.logo{width:34px;height:34px}
 #btnTheme{order:2}.mw{order:3}#btnMenu .lbl{display:none}
 .search{order:4;flex-basis:100%}
 .fw{order:5;flex:1}.fw .btn{width:100%;justify-content:center}
 #btnCompare{order:6;flex:1;justify-content:center}
 .sg:last-child{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:4px}.sg:last-child .sc{flex:none}
 .facts .inl{display:inline-block;margin-right:6px}.facts td.stc{display:none}.facts th.l{width:34%}
 .evc .kv{grid-template-columns:90px minmax(0,1fr)}}
@media (prefers-reduced-motion:no-preference){.sec,.btn,.item{transition:background .15s,box-shadow .15s}}
@media print{.top,.strip,.side,.back,.more,.popmenu,.links,.evc button{display:none!important}
 body{background:#fff;color:#000}.layout{display:block;padding:0}#detail{display:block!important}.grid{display:block}
 .sec,.insc,.evc{box-shadow:none;break-inside:avoid;margin-bottom:10px}.ins{display:block}.ins .col{display:block}}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="brand"><div class="logo" id="logo"></div><div><b>Signalpost</b><span>company profiles</span></div></div>
  <div class="runinfo" id="runinfo"></div>
  <div class="search"><label for="q" class="sr">Search companies by name, organisation number or municipality</label><span id="searchIcon"></span><input id="q" type="search" placeholder="Search name / org no / municipality…" autocomplete="off"><kbd id="kbd">Ctrl K</kbd><button type="button" class="clr" id="qclr" aria-label="Clear search" hidden>✕</button></div>
  <div class="pop fw"><button class="btn" id="btnFilter" aria-haspopup="true" aria-expanded="false"><span id="icFilter"></span><span class="lbl" id="fltLbl">Filter</span></button><div class="popmenu" id="popFilter" hidden></div></div>
  <button class="btn primary" id="btnCompare" disabled><span id="icScale"></span><span class="lbl">Compare</span> (<span id="cmpN">0</span>)</button>
  <button class="btn icon" id="btnTheme"></button>
  <div class="pop mw"><button class="btn" id="btnMenu" aria-haspopup="true" aria-expanded="false" aria-label="Menu"><span id="icDots"></span><span class="lbl">Menu</span></button><div class="popmenu right" id="popMenu" hidden></div></div>
</header>
<section class="strip" id="strip" aria-label="Evidence coverage, data freshness and state counts"></section>
<div class="layout">
  <aside class="side" id="side" aria-label="Companies">
    <div class="sidehead"><h2>Companies (<span id="count">0</span>)</h2>
      <div class="srow"><select id="sort" aria-label="Sort companies"><option value="az">A–Z</option><option value="za">Z–A</option><option value="facts">Most facts</option><option value="changes">Most changes</option><option value="org">Org no</option></select>
      <input id="q2" type="search" placeholder="Search company / org no…" aria-label="Filter the company list by name or organisation number" autocomplete="off"></div>
      <p class="hint" id="cmpHint" role="status"></p></div>
    <div id="list"></div>
    <button class="btn morebtn" id="moreBtn" hidden>Show more</button>
  </aside>
  <main id="detail" tabindex="-1"></main>
</div>
<script>

ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
chev:'<path d="M9 5l7 7-7 7"/>',

doc:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 12h6M10 16h4"/>',
mappin:'<path d="M12 21s6-5.4 6-10a6 6 0 1 0-12 0c0 4.6 6 10 6 10z"/><circle cx="12" cy="11" r="2"/>',
logo:'<path d="M5 20V11M12 20V5M19 20v-7"/>'};
function ic(n,s){s=s||18;return'<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">'+P[n]+'</svg>'}
var ST={available:["AVAILABLE","✓","Found, verified for this exact company, with evidence"],

function narrow(){return window.innerWidth<=900}

function has(c,st){return c.cl.some(function(x){return x[4]===st})}
function hasField(c,names){return c.cl.some(function(x){return names.indexOf(x[1])>-1&&x[4]==="available"})}
function pass(c){
  if(S.q&&(c.n+" "+c.o+" "+c.m+" "+c.w).toLowerCase().indexOf(S.q)<0)return false;
  switch(S.f){case"web":return hasField(c,["official_website"]);case"hiring":return hasField(c,["job_posting"]);case"activity":return hasField(c,["news_item"]);
  case"assess":return hasField(c,["food_safety_inspection","public_approval"]);case"changes":return c.ch.length>0;case"ambiguous":return has(c,"ambiguous");
  case"blocked":return has(c,"blocked");case"failed":return has(c,"failed");case"runfail":return c.t!=="completed";default:return true}}
function sorted(rows){var r=rows.slice();

  else if(S.sort==="facts")r.sort(function(a,b){return b.ec[1]-a.ec[1]});
  else if(S.sort==="changes")r.sort(function(a,b){return b.ch.length-a.ch.length});
  else if(S.sort==="org")r.sort(function(a,b){return a.o<b.o?-1:1});
  else r.sort(function(a,b){return a.n.localeCompare(b.n)});return r}

    (low?'<span class="st st-failed sm"><i aria-hidden="true">✕</i>'+num(gap)+' WITHOUT EVIDENCE</span>':'<span class="st st-available sm"><i aria-hidden="true">✓</i>ALL EVIDENCED</span>')+'</div>';
  h+='<div class="sg"><span class="lab">Data freshness</span><span>Last verified: <b>'+esc(s.newest||"n/a")+'</b><span class="dsk"> · oldest evidence '+esc(s.oldest||"n/a")+'</span> · '+num(s.stale)+' stale claim'+(s.stale===1?"":"s")+'</span></div>';

function newest(c){var d=c.cl.filter(function(x){return x[4]==="available"&&x[10]}).map(function(x){return x[10]}).sort();return d.length?d[d.length-1]:""}

function srcHtml(c,refs){return refs.map(function(i){var e=c.ev[i];if(!e)return"";

  (safe(e[0])?'<a href="'+esc(safe(e[0]))+'" target="_blank" rel="noopener noreferrer">'+esc(e[0])+'</a>':esc(e[0]))+'<br>sha256 '+esc(e[2])+'…'+(e[4]?'<br>“'+esc(e[4])+'”':'')+'</details>'}).join("")}

    var other=rows.filter(function(x){return !(x[5]&&x[5].indexOf(" – ")>-1)});

    h+='<tr><th scope="row" class="l">'+esc(x[2])+(x[5]&&!grouped?'<br><span class="mut">'+esc(x[5])+'</span>':'')+'</th><td><span class="inl">'+b+'</span>'+

function kvHtml(rows){return'<div class="kv">'+rows.map(function(r){var u=safe(r[2]);
  return'<div class="k">'+esc(r[0])+'</div><div class="v">'+(u?'<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(r[1])+'</a>':esc(r[1]))+'</div>'}).join("")+'</div>'}

    body='<table class="mini"><thead><tr><th scope="col">Year</th><th scope="col">Period</th><th scope="col">Revenue</th><th scope="col">Result</th><th scope="col">Equity</th></tr></thead><tbody>'+
      c.ac.rows.map(function(r){return'<tr><th scope="row" style="text-align:left;font-weight:700">'+esc(r[0])+'</th><td>'+esc(r[1])+'</td><td>'+cell(r[2])+'</td><td>'+cell(r[3])+'</td><td>'+cell(r[4])+'</td></tr>'}).join("")+'</tbody></table>'+

  else if(pv.rows.length)body=kvHtml(pv.rows);

   '<div class="kv"><div class="k">Source</div><div class="v">'+esc(e[3])+' · '+esc((e[1]||"").slice(0,10))+'</div>'+

  $("logo").innerHTML=ic("logo",22);$("searchIcon").innerHTML=ic("search",16);$("icFilter").innerHTML=ic("filter",16);$("icScale").innerHTML=ic("scale",16);$("icDots").innerHTML=ic("dots",16);
  setTheme(document.documentElement.getAttribute("data-theme")||"light");
  $("runinfo").innerHTML='<b>Run '+esc(REPORT.run_id)+'</b><br>'+num(REPORT.emitted_envelopes)+' companies · '+esc(REPORT.elapsed_seconds)+'s · '+num((REPORT.requests||{}).total)+' requests · $'+esc(REPORT.third_party_cost_usd);
  renderStrip();buildPops();renderList();syncCompare();syncFilter();
  function hh(){document.documentElement.style.setProperty("--hh",$("top").offsetHeight+"px")}hh();window.addEventListener("resize",hh);
  $("q").addEventListener("input",function(){setQ(this.value)});$("q2").addEventListener("input",function(){setQ(this.value)});
  $("qclr").addEventListener("click",function(){setQ("");$("q").focus()});
  $("sort").addEventListener("change",function(){S.sort=this.value;renderList()});
  $("moreBtn").addEventListener("click",function(){S.page+=200;renderList()});
  $("btnFilter").addEventListener("click",function(e){e.stopPropagation();togglePop("popFilter","btnFilter")});
  $("btnMenu").addEventListener("click",function(e){e.stopPropagation();togglePop("popMenu","btnMenu")});
  $("popFilter").addEventListener("change",function(e){if(e.target.name==="flt"){S.f=e.target.value;S.page=200;syncFilter();renderList();closePops()}});
  $("popFilter").addEventListener("click",function(e){e.stopPropagation()});$("popMenu").addEventListener("click",function(e){e.stopPropagation()});
  document.addEventListener("click",closePops);
  $("btnTheme").addEventListener("click",function(){setTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark")});
  $("btnCompare").addEventListener("click",renderCompare);
  $("list").addEventListener("change",function(e){var cb=e.target;if(!cb.classList||!cb.classList.contains("cb"))return;
    if(cb.checked){if(selCount()>=4){cb.checked=false;syncCompare("Up to 4 companies can be compared. Untick one first.");return}S.sel[cb.dataset.c]=1}else delete S.sel[cb.dataset.c];syncCompare()});
  $("list").addEventListener("click",function(e){
    if(e.target.closest&&e.target.closest("[data-clear]")){S.f="";syncFilter();setQ("");return}
    if(e.target.closest&&e.target.closest(".cbw"))return;
    var it=e.target.closest&&e.target.closest(".item");if(it)show(it.dataset.o)});
  $("list").addEventListener("keydown",function(e){var it=e.target.closest&&e.target.closest(".item");if(!it||e.target!==it)return;
    if(e.key==="Enter"||e.key===" "){e.preventDefault();show(it.dataset.o,true)}
    else if(e.key==="ArrowDown"&&it.nextElementSibling&&it.nextElementSibling.classList.contains("item")){it.nextElementSibling.focus();e.preventDefault()}
    else if(e.key==="ArrowUp"&&it.previousElementSibling&&it.previousElementSibling.classList.contains("item")){it.previousElementSibling.focus();e.preventDefault()}});
  $("detail").addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("[data-act]");if(!b)return;var a=b.dataset.act,c=byOrg(S.cur);
    if(a==="back"){document.body.classList.remove("show-detail");var it=document.querySelector(".item.active");if(it)it.focus({preventScroll:false})}
    else if(a==="toggle"&&c){S.open[b.dataset.sec]=!S.open[b.dataset.sec];$("detail").innerHTML=detailHtml(c);var t=document.querySelector('[data-sec="'+b.dataset.sec+'"]');if(t)t.focus({preventScroll:true})}
    else if(a==="evnext"&&c){S.evIdx=(S.evIdx+1)%Math.max(1,c.ev.length);$("detail").innerHTML=detailHtml(c);var n=document.querySelector('[data-act=evnext]');if(n)n.focus({preventScroll:true})}
    else if(a==="evprev"&&c){S.evIdx=(S.evIdx-1+c.ev.length)%Math.max(1,c.ev.length);$("detail").innerHTML=detailHtml(c);var p=document.querySelector('[data-act=evprev]');if(p)p.focus({preventScroll:true})}
    else if(a==="closecmp"){if(c)show(S.cur,true);else{$("detail").innerHTML="";document.body.classList.remove("show-detail")}}});
  document.addEventListener("keydown",function(e){var tag=(e.target.tagName||"").toLowerCase();
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("q").focus();$("q").select()}
    else if(e.key==="/"&&tag!=="input"&&tag!=="select"&&tag!=="textarea"){e.preventDefault();$("q").focus()}
    else if(e.key==="Escape"){closePops()}});
  var m=(location.hash||"").match(/^#(\d{9})$/);
  if(m&&byOrg(m[1]))show(m[1]);else if(DATA.length&&!narrow())show(sorted(DATA.filter(pass))[0].o)}
init();
})();
</script>
</body>
</html>
